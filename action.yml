name: Tessaric verify
description: Prove what your code does in CI. Runs tessaric verify, annotates the pull request and writes the report to the job summary.
author: tessariclabs
branding:
  icon: check-circle
  color: purple

inputs:
  version:
    description: Release to install, as X.Y.Z or latest.
    default: latest
  args:
    description: Extra arguments for tessaric verify, for example --require-baseline.
    default: ""
  workspace:
    description: The workspace directory, relative to the checkout.
    default: .
  baselines:
    description: A file written by tessaric export, relative to the workspace, imported before verify so linked items have their baselines on a fresh checkout. Empty imports nothing.
    default: ""
  shard:
    description: Run only shard I of N of the tests, as I/N (for example 1/4). Empty runs every test.
    default: ""
  nothing-proved:
    description: What a run that proved nothing yet (exit 3) does to the step, fail or pass.
    default: fail
  annotations:
    description: Annotate the changed files with what can fail, the checks that failed and the drift.
    default: "true"
  summary:
    description: Write tessaric report --format markdown to the job summary.
    default: "true"
  cache:
    description: Keep the binary, the toolchains, the dependencies and the workspace state between runs.
    default: "true"

outputs:
  exit-code:
    description: The exit code of tessaric verify (0 ok, 1 a check failed or an obligation can fail, 2 could not determine, 3 nothing was checked or nothing was proved yet, 130 interrupted).
    value: ${{ steps.verify.outputs.exit-code }}
  version:
    description: The tessaric release that ran.
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Resolve the release
      id: release
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=x86_64-unknown-linux-gnu; ext=tgz ;;
          Linux/ARM64) target=aarch64-unknown-linux-gnu; ext=tgz ;;
          macOS/ARM64) target=aarch64-apple-darwin; ext=tgz ;;
          Windows/X64) target=x86_64-pc-windows-gnullvm; ext=zip ;;
          *) echo "::error title=tessaric::tessaric publishes no binary for $RUNNER_OS $RUNNER_ARCH"; exit 2 ;;
        esac
        repo="https://github.com/tessariclabs/releases"
        if [ "$VERSION" = latest ]; then
          # the redirect GitHub answers, so no API call and no rate limit
          tag=$(curl -fsSIL -o /dev/null -w '%{url_effective}' "$repo/releases/latest")
          tag="${tag##*/}"
          case "$tag" in v[0-9]*) ;; *) echo "::error title=tessaric::no tessaric release is published yet"; exit 2 ;; esac
        else
          tag="v${VERSION#v}"
        fi
        home="$HOME/.tessaric-home"
        mkdir -p "$home"
        {
          echo "target=$target"
          echo "ext=$ext"
          echo "tag=$tag"
          echo "base=$repo/releases/download/$tag"
          echo "home=$home"
          echo "bin=$home/bin-$tag"
          echo "branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        } >> "$GITHUB_OUTPUT"
        # A pinned version stays pinned, and CI never updates tessaric in place.
        echo "TESSARIC_NO_UPDATE=1" >> "$GITHUB_ENV"
        if [ "$VERSION" != latest ]; then echo "TESSARIC_PINNED_VERSION=$tag" >> "$GITHUB_ENV"; fi

    # Five cache layers, each keyed by what changes it, so a later run downloads, unpacks,
    # fetches and proves again only what changed.
    - name: Restore the binary
      id: cache-bin
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.release.outputs.bin }}
        key: tessaric-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.tag }}

    # Toolchain components are stored by their content, so an earlier version's cache still
    # serves every component the new version shares with it.
    - name: Restore the toolchains
      id: cache-toolchains
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.release.outputs.home }}/toolchains
          ${{ steps.release.outputs.home }}/sysroot
          ${{ steps.release.outputs.home }}/c-target
        key: tessaric-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.tag }}
        restore-keys: tessaric-toolchains-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore the dependencies
      id: cache-deps
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.release.outputs.home }}/cargo
          ${{ steps.release.outputs.home }}/store/go
        key: tessaric-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/**/Cargo.lock', inputs.workspace), format('{0}/**/go.sum', inputs.workspace), format('{0}/**/package-lock.json', inputs.workspace), format('{0}/**/yarn.lock', inputs.workspace), format('{0}/**/pnpm-lock.yaml', inputs.workspace), format('{0}/**/poetry.lock', inputs.workspace), format('{0}/**/uv.lock', inputs.workspace), format('{0}/**/requirements*.txt', inputs.workspace), format('{0}/**/pom.xml', inputs.workspace), format('{0}/**/*.gradle*', inputs.workspace), format('{0}/**/packages.lock.json', inputs.workspace)) }}
        restore-keys: tessaric-deps-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore the store
      id: cache-store
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.release.outputs.home }}/store/sha256
          ${{ steps.release.outputs.home }}/store/refs
        key: tessaric-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.branch }}-${{ github.run_id }}
        restore-keys: |
          tessaric-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.branch }}-
          tessaric-store-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-

    - name: Restore the workspace state
      id: cache-state
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ inputs.workspace }}/.tessaric
          !${{ inputs.workspace }}/.tessaric/l0/prog
        key: tessaric-state-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.branch }}-${{ github.run_id }}
        restore-keys: |
          tessaric-state-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.branch }}-
          tessaric-state-${{ runner.os }}-${{ runner.arch }}-${{ github.event.repository.default_branch }}-

    - name: Install tessaric
      shell: bash
      env:
        BASE: ${{ steps.release.outputs.base }}
        TARGET: ${{ steps.release.outputs.target }}
        EXT: ${{ steps.release.outputs.ext }}
        DIR: ${{ steps.release.outputs.bin }}
        HIT: ${{ steps.cache-bin.outputs.cache-hit }}
      run: |
        mkdir -p "$DIR"
        if [ "$HIT" != true ] || ! ls "$DIR"/tessaric* >/dev/null 2>&1; then
          archive="tessaric-$TARGET.$EXT"
          tmp="$RUNNER_TEMP/tessaric-download"
          mkdir -p "$tmp"
          if ! curl -fsSL --retry 3 -o "$tmp/$archive" "$BASE/$archive"; then
            echo "::error title=tessaric::release $(basename "$BASE") has no $archive for this runner"
            exit 2
          fi
          curl -fsSL --retry 3 -o "$tmp/$archive.sha256" "$BASE/$archive.sha256"
          want=$(cut -d ' ' -f 1 "$tmp/$archive.sha256" | head -n 1)
          if command -v sha256sum >/dev/null; then got=$(sha256sum "$tmp/$archive" | cut -d ' ' -f 1); else got=$(shasum -a 256 "$tmp/$archive" | cut -d ' ' -f 1); fi
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error title=tessaric::checksum mismatch for $archive: expected '$want', got '$got'"
            exit 2
          fi
          if [ "$EXT" = zip ]; then unzip -q -o "$tmp/$archive" -d "$DIR"; else tar -xzf "$tmp/$archive" -C "$DIR"; fi
          rm -rf "$tmp"
        fi
        echo "$DIR" >> "$GITHUB_PATH"

    - name: Verify
      id: verify
      shell: bash
      env:
        TESSARIC_HOME: ${{ steps.release.outputs.home }}
        WORKSPACE: ${{ inputs.workspace }}
        ARGS: ${{ inputs.args }}
        SHARD: ${{ inputs.shard }}
        BASELINES: ${{ inputs.baselines }}
        SUMMARY: ${{ inputs.summary }}
        ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        tessaric toolchain unpack >/dev/null
        if [ -n "$BASELINES" ]; then
          tessaric --workspace "$WORKSPACE" import "$WORKSPACE/$BASELINES"
        fi
        set +e
        # ARGS is split on purpose: it is a list of extra flags.
        if [ -n "$SHARD" ]; then
          tessaric --workspace "$WORKSPACE" verify --shard "$SHARD" $ARGS
        else
          tessaric --workspace "$WORKSPACE" verify $ARGS
        fi
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$ANNOTATIONS" = true ] && [ "$code" != 2 ] && [ "$code" != 130 ]; then
          # One annotation per entry of what needs attention, at its file and line (GitHub shows
          # the first 50 of a job; the summary below has every entry).
          prefix=""
          [ "$WORKSPACE" = . ] || prefix="${WORKSPACE%/}/"
          list="$RUNNER_TEMP/tessaric-attention.jsonl"
          if tessaric --workspace "$WORKSPACE" --quiet attention --format json > "$list" 2>/dev/null; then
            # workflow commands escape % and line breaks in the message, and : and , in a property
            tail -n +2 "$list" | head -n 50 | jq -r --arg p "$prefix" '
                def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
                def prop: data | gsub(":"; "%3A") | gsub(","; "%2C");
                (if .group == "can_fail" or .group == "checks_failed" then "error"
                 elif .group == "drift" then "warning" else "notice" end) as $level
                | (if .file then " file=\("\($p)\(.file)" | prop)" + (if .line then ",line=\(.line)" else "" end) + "," else " " end) as $at
                | "::\($level)\($at)title=\("tessaric, \({"can_fail": "can fail", "checks_failed": "check failed", "drift": "drift", "tessaric": "a problem in tessaric, not in your code"}[.group] // .group): \(.kind)" | prop)::\("\(.title): \(.sentence)" | data)"' || true
          else
            echo "::notice title=tessaric::this release cannot list what needs attention, so nothing is annotated"
          fi
        fi
        if [ "$SUMMARY" = true ]; then
          if ! tessaric --workspace "$WORKSPACE" --quiet report --format markdown >> "$GITHUB_STEP_SUMMARY"; then
            echo "tessaric could not write a report (verify exited $code)" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

    # The caches are saved before the result decides the step, so a failing run still keeps
    # what it built. A layer keyed by content is saved only when it was not restored exactly.
    - name: Save the binary
      if: inputs.cache == 'true' && steps.cache-bin.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.release.outputs.bin }}
        key: tessaric-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.tag }}
    - name: Save the toolchains
      if: inputs.cache == 'true' && steps.cache-toolchains.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.release.outputs.home }}/toolchains
          ${{ steps.release.outputs.home }}/sysroot
          ${{ steps.release.outputs.home }}/c-target
        key: tessaric-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.tag }}
    - name: Save the dependencies
      if: inputs.cache == 'true' && steps.cache-deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.release.outputs.home }}/cargo
          ${{ steps.release.outputs.home }}/store/go
        key: ${{ steps.cache-deps.outputs.cache-primary-key }}
    - name: Save the store
      if: inputs.cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ steps.release.outputs.home }}/store/sha256
          ${{ steps.release.outputs.home }}/store/refs
        key: tessaric-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.branch }}-${{ github.run_id }}
    - name: Save the workspace state
      if: inputs.cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ inputs.workspace }}/.tessaric
          !${{ inputs.workspace }}/.tessaric/l0/prog
        key: tessaric-state-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.branch }}-${{ github.run_id }}

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.verify.outputs.exit-code }}
        NOTHING_PROVED: ${{ inputs.nothing-proved }}
      run: |
        case "$CODE" in
          0) exit 0 ;;
          3) if [ "$NOTHING_PROVED" = pass ]; then echo "::warning title=tessaric::nothing was proved yet (exit 3); the step passes because nothing-proved is pass"; exit 0; fi
             echo "::error title=tessaric::nothing was proved yet (exit 3)"; exit 3 ;;
          *) exit "$CODE" ;;
        esac
